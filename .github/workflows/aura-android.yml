name: Aura Android checks and build
on:
  push:
    branches: [main]
    paths: ['AuraOne/**', 'Checks/**', '.github/workflows/aura-android.yml', 'global.json']
  pull_request:
    paths: ['AuraOne/**', 'Checks/**', '.github/workflows/aura-android.yml', 'global.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - run: dotnet run --project Checks/Checks.csproj -p:UseSharedCompilation=false
  android:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AURA_ANDROID_SDK: /tmp/aura-android-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: dotnet workload install android --skip-manifest-update
      - name: Install Android dependencies
        run: dotnet build AuraOne/AuraOne.csproj -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory="$AURA_ANDROID_SDK" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSdkLicenses=True -v:minimal
      - name: Compile release APK
        run: dotnet publish AuraOne/AuraOne.csproj -c Release -r android-arm64 -m:1 -p:UseSharedCompilation=false -p:AndroidSdkDirectory="$AURA_ANDROID_SDK" -p:JavaSdkDirectory="$JAVA_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: aura-one-ci-apk
          path: AuraOne/bin/Release/net10.0-android/**/*.apk
          if-no-files-found: error
          retention-days: 7

  emulator:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AURA_ANDROID_SDK: /tmp/aura-android-sdk
      AURA_TEST_OUTPUT: android-smoke-output
      ANDROID_AVD_HOME: /tmp/aura-android-avd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: dotnet workload install android --skip-manifest-update
      - name: Install Android dependencies
        run: dotnet build AuraOne/AuraOne.csproj -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory="$AURA_ANDROID_SDK" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSdkLicenses=True -v:minimal
      - name: Build native emulator APK
        run: dotnet publish AuraOne/AuraOne.csproj -c Release -r android-x64 -p:RuntimeIdentifiers=android-x64 -m:1 -p:UseSharedCompilation=false -p:AndroidSdkDirectory="$AURA_ANDROID_SDK" -p:JavaSdkDirectory="$JAVA_HOME"
      - name: Install emulator image
        shell: bash
        run: |
          AURA_SDKMANAGER=$(find "$AURA_ANDROID_SDK" -name sdkmanager -type f -print -quit)
          "$AURA_SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          AURA_AVDMANAGER=$(find "$AURA_ANDROID_SDK" -name avdmanager -type f -print -quit)
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$AURA_AVDMANAGER" create avd -n aura_ci -p "$ANDROID_AVD_HOME/aura_ci.avd" -k "system-images;android-35;google_apis;x86_64" --force
          sudo chmod 666 /dev/kvm
      - name: Run native smoke checks
        timeout-minutes: 10
        shell: bash
        run: |
          export ANDROID_HOME="$AURA_ANDROID_SDK"
          export ANDROID_SDK_ROOT="$AURA_ANDROID_SDK"
          export PATH="$AURA_ANDROID_SDK/platform-tools:$PATH"
          mkdir -p android-smoke-output
          "$AURA_ANDROID_SDK/emulator/emulator" -list-avds | tee android-smoke-output/available-avds.txt
          "$AURA_ANDROID_SDK/emulator/emulator" -avd aura_ci -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 2048 -cores 2 > android-smoke-output/emulator.log 2>&1 &
          timeout 60 adb wait-for-device
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell input keyevent 82
          AURA_TEST_APK=$(find AuraOne/bin/Release -name "*-Signed.apk" -print -quit)
          adb install "$AURA_TEST_APK"
          timeout 420 python3 Checks/android_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aura-native-emulator-evidence
          path: android-smoke-output/
          retention-days: 7
