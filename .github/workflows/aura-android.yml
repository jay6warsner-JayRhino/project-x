name: Aura Android checks and build
on:
  push:
    branches: [aura-one-android, main]
    paths: ['AuraOne/**', 'Checks/**', '.github/workflows/aura-android.yml', 'global.json']
  pull_request:
    paths: ['AuraOne/**', 'Checks/**', '.github/workflows/aura-android.yml', 'global.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - run: dotnet run --project Checks/Checks.csproj -p:UseSharedCompilation=false
  android:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: dotnet workload install android --skip-manifest-update
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile release APK
        run: dotnet publish AuraOne/AuraOne.csproj -c Release -m:1 -p:UseSharedCompilation=false -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: aura-one-ci-apk
          path: AuraOne/bin/Release/net10.0-android/*.apk
          if-no-files-found: error
          retention-days: 7
